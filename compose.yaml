services:
  postgres:
    image: postgres:17.12-alpine
    container_name: radar-vagas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar_vagas}
      POSTGRES_USER: ${POSTGRES_USER:-radar_vagas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_vagas_local}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - radar_vagas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-radar_vagas} -d $${POSTGRES_DB:-radar_vagas}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  radar_vagas_pgdata:
